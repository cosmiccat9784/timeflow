name: TimeFlow builds

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auto-bump patch version
        run: |
          node -e "
            const fs=require('fs');
            const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
            const v=pkg.version.split('.').map(Number);
            v[2]++;
            const nv=v.join('.');
            pkg.version=nv;
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
            const tauri=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            tauri.version=nv;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri,null,2)+'\n');
            let store=fs.readFileSync('src/store.ts','utf8');
            store=store.replace(/APP_VERSION = \"[^\"]+\"/, `APP_VERSION = "${nv}"`);
            fs.writeFileSync('src/store.ts', store);
            console.log('Bumped to', nv);
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src/store.ts
          git diff --cached --quiet || (git commit -m "Bump version to $(node -p \"require('./package.json').version\") [skip ci]" && git push)

  # Unit tests run once on Linux (fast feedback for the scheduling engines).
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  # Platform packages build on native runners (§23.11 — no cross-OS packaging).
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: appimage
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon src-tauri/icons/icon.svg
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: timeflow-${{ runner.os }}-${{ matrix.bundles }}
          path: src-tauri/target/release/bundle/
