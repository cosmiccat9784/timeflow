name: TimeFlow builds

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests run once on Linux (fast feedback for the scheduling engines).
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Platform packages build on native runners (§23.11 — no cross-OS packaging).
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
          - os: macos-latest
            target: dmg
