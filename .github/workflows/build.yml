name: TimeFlow builds

permissions:
  contents: write

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Bump version')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Auto-bump patch version
        run: |
          cat > /tmp/bump.mjs << 'EOF'
          import fs from 'fs';
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const v = pkg.version.split('.').map(Number);
          v[2]++;
          const nv = v.join('.');
          pkg.version = nv;
          fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
          tauri.version = nv;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri,null,2)+'\n');
          let store = fs.readFileSync('src/store.ts','utf8');
          store = store.replace(/APP_VERSION = "[^"]+"/, 'APP_VERSION = "' + nv + '"');
          fs.writeFileSync('src/store.ts', store);
          console.log('Bumped to', nv);
          EOF
          node /tmp/bump.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src/store.ts
          VERSION=$(node -p "require('./package.json').version")
          git diff --cached --quiet || (git commit -m "Bump version to $VERSION" && git push)

  # Unit tests run once on Linux (fast feedback for the scheduling engines).
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  # Platform packages build on native runners (§23.11 — no cross-OS packaging).
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: nsis
            extra: ""
            bundle_dir: src-tauri/target/release/bundle
          # Universal binary so the DMG runs on both Apple Silicon and Intel.
          - os: macos-latest
            bundles: app,dmg
            artifact: dmg
            extra: "--target universal-apple-darwin"
            bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
          - os: ubuntu-22.04
            bundles: appimage
            artifact: appimage
            extra: ""
            bundle_dir: src-tauri/target/release/bundle
          - os: ubuntu-22.04
            bundles: deb
            artifact: deb
            extra: ""
            bundle_dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Secrets are read here rather than at job level: an empty APPLE_CERTIFICATE
      # in the environment makes Tauri attempt an import of zero bytes and fail.
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No Apple certificate secret — using ad-hoc signing."
            exit 0
          fi
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          # Hand the identity to the build step; APPLE_CERTIFICATE is deliberately
          # not re-exported so Tauri does not try to import it again.
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon src-tauri/icons/icon.svg
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.extra }}
      # Gatekeeper reports "damaged" for a downloaded bundle whose signature is
      # missing or inconsistent with its nested Mach-O binaries. Rust ad-hoc
      # signs the executable itself, so the .app bundle must be signed to match.
      # This runs only on the ad-hoc path; with a Developer ID certificate Tauri
      # already signed and notarized the bundle and re-signing would break it.
      - name: Ad-hoc sign and repackage macOS DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY == ''
        run: |
          set -euo pipefail
          BUNDLE="${{ matrix.bundle_dir }}"
          APP=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' -print -quit)
          echo "App bundle: $APP"
          test -n "$APP"
          xattr -cr "$APP" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          DMG=$(find "$BUNDLE/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          echo "DMG: $DMG"
          rm -f "$DMG"
          hdiutil create -volname "Time Flow" -srcfolder "$APP" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          # Prove the app inside the image is signed too (explicit mountpoint so
          # there is no fragile parsing of hdiutil's output).
          MNT="$RUNNER_TEMP/dmg-mnt"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT"
          APP_IN_DMG=$(find "$MNT" -maxdepth 1 -name '*.app' -print -quit)
          echo "App inside DMG: $APP_IN_DMG"
          test -n "$APP_IN_DMG"
          codesign --verify --deep --strict --verbose=2 "$APP_IN_DMG"
          hdiutil detach "$MNT"
      - name: Verify Developer ID signature and notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          APP=$(find "${{ matrix.bundle_dir }}/macos" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
      # Authenticode-sign the installer so Windows shows the publisher name
      # instead of "Unknown publisher".
      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host 'No Windows certificate secret — installer stays unsigned (SmartScreen will show "Unknown publisher").'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $files = Get-ChildItem -Path '${{ matrix.bundle_dir }}' -Recurse -Include *.exe
          if (-not $files) { throw 'No Windows executables found to sign.' }
          foreach ($f in $files) {
            & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($f.Name)" }
            & signtool verify /pa /v $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for $($f.Name)" }
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
          }
          Remove-Item $pfx -Force
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: timeflow-${{ runner.os }}-${{ matrix.artifact }}
          path: ${{ matrix.bundle_dir }}/
